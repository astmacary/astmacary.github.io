<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RCI Serve</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#081C33" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RCI Serve">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap">
<style>
/* RCI Serve: one home for all four RCI team apps. Same look as the team apps (navy + gold). */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --surface-2:#E7EBF2; --line:#D3DAE5;
  --fg:#0B1D33; --muted:#566479; --accent:#8A6631; --accent-ink:#FFFFFF; --accent-soft:#F4EBDD;
  --ok:#1E7A4C; --ok-soft:#DDF1E6; --warn:#8A5A00; --warn-soft:#FBEBCD; --bad:#B3261E; --bad-soft:#F9DEDC;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px; --go:#1E8A52; --stop:#C62828; --navy:#0B1D33;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#03111F; --surface:#081C33; --surface-2:#0E2845; --line:#1A3555;
  --fg:#EEF2F7; --muted:#A3B2C6; --accent:#D2B07C; --accent-ink:#03111F; --accent-soft:#252C38;
  --ok:#5CCB8F; --ok-soft:#0F2E2A; --warn:#E3B866; --warn-soft:#2E2A20; --bad:#F2877F; --bad-soft:#33202C; color-scheme:dark}
  :root:not([data-theme="light"]) .team{--t:var(--td)}}
:root[data-theme="dark"]{
  --bg:#03111F; --surface:#081C33; --surface-2:#0E2845; --line:#1A3555;
  --fg:#EEF2F7; --muted:#A3B2C6; --accent:#D2B07C; --accent-ink:#03111F; --accent-soft:#252C38;
  --ok:#5CCB8F; --ok-soft:#0F2E2A; --warn:#E3B866; --warn-soft:#2E2A20; --bad:#F2877F; --bad-soft:#33202C; color-scheme:dark}
:root[data-theme="dark"] .team{--t:var(--td)}
.team{--t:var(--tl)}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
img{max-width:100%}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (max-width:820px){input,select,textarea{font-size:16px!important}}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-top:16px;padding-bottom:10px}
.brand{display:flex;align-items:center;min-width:0;flex:1;background:none;border:none;padding:0;color:inherit}
.brand .wm{height:52px;width:auto}
.wm-dark{display:none}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .wm-light{display:none}:root:not([data-theme="light"]) .wm-dark{display:block}}
:root[data-theme="dark"] .wm-light{display:none}:root[data-theme="dark"] .wm-dark{display:block}
.iconbtn{background:none;border:1px solid var(--line);border-radius:999px;width:40px;height:40px;display:grid;place-items:center;color:var(--muted);flex:none;padding:0;position:relative}
.iconbtn svg{width:18px;height:18px}
.iconbtn.spin svg{animation:spin 1s linear infinite}
.me-btn{border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;overflow:visible;width:50px;height:50px}
.me-btn img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.red-dot{position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--bad);border:2px solid var(--surface)}

main{padding:18px 0 calc(96px + env(safe-area-inset-bottom,0px))}
main .wrap{display:flex;flex-direction:column;gap:22px}
.kicker{font-size:12px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1.greet{font-family:var(--display);font-weight:700;font-size:clamp(30px,8vw,40px);line-height:1.02;margin:2px 0 0;text-wrap:balance}
h1.page{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.02;margin:0;text-transform:uppercase;letter-spacing:.02em}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{margin:0;font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sec-head .acts{display:flex;flex-direction:row;gap:8px;flex:none}
.iconbtn.sm{width:32px;height:32px}
.iconbtn.sm svg{width:16px;height:16px}
.iconbtn.danger{border-color:var(--stop);color:var(--stop)}
.row-acts{display:flex;gap:6px;flex:none}
.row .row-acts .iconbtn{border:0;background:var(--surface-2);color:var(--muted)}
.cform{display:flex;flex-direction:column;gap:10px;padding:14px}
.cform label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.cform input{height:42px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;font-family:var(--body)}
.cform select{height:42px;padding:0 10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;font-family:var(--body)}
.cform textarea{min-height:120px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:15px;font-family:var(--body);resize:vertical}
.cform .cform-acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.chiprow{display:flex;flex-wrap:wrap;gap:8px}
.chipcheck{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12.5px;color:var(--fg)}
.chipcheck[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.notes-tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tool{border:1px solid var(--line);background:var(--surface-2);color:var(--fg);border-radius:8px;padding:6px 12px;font-size:14px;font-weight:600;min-width:44px}
.tool.swatch{width:30px;height:30px;min-width:30px;padding:0;border-radius:50%}
.tool.swatch.reset{background:var(--surface-2);font-weight:700;color:var(--muted)}
.notes-editor{min-height:160px;outline:none;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;line-height:1.55}
.notes-editor:focus{box-shadow:0 0 0 2px var(--accent)}
.notes p,.notes div{margin:0 0 .5em}
.notes ul,.notes ol{padding-left:1.3em}
.count{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--bad);color:#FFFFFF;font-family:var(--body);font-size:12px;font-weight:700;letter-spacing:0;display:inline-flex;align-items:center;justify-content:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.panel.pad{padding:14px;display:flex;flex-direction:column;gap:8px}
.muted{color:var(--muted)}
.hint{font-size:13px;color:var(--muted);margin:0}

/* team tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--fg);min-height:100px}
.tile:active{transform:scale(.98)}
.t-ic{width:36px;height:36px;border-radius:10px;background:var(--tl);color:#FFFFFF;display:grid;place-items:center;flex:none}
.t-ic svg{width:19px;height:19px}
.tile b{font-size:15px;line-height:1.2}
.tile small{font-size:12px;color:var(--muted)}
.tile small.hot{color:var(--bad);font-weight:600}
.tile small.good{color:var(--ok);font-weight:600}
.tile .count{position:absolute;top:12px;right:12px}
.tile .admin{position:absolute;top:14px;right:12px;font-size:10px;font-weight:700;letter-spacing:.08em;color:var(--accent)}

/* rows */
.row{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--surface-2);text-decoration:none;color:var(--fg)}
.row:last-child{border-bottom:0}
.bar{width:4px;align-self:stretch;border-radius:2px;background:var(--t);flex:none}
.row .info{flex:1;min-width:0}
.tlabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t)}
.row .info b{display:block;font-weight:700;line-height:1.25}
.row .info small{display:block;font-size:12px;color:var(--muted)}
.acts{display:flex;flex-direction:column;gap:6px;flex:none}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;min-height:36px;padding:0 14px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--fg)}
.btn.accept{background:var(--go);border-color:var(--go);color:#FFFFFF}
.btn.decline{background:transparent;border:1.5px solid var(--stop);color:var(--stop)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:46px;font-size:15px;padding:0 20px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55}
.pill{font-size:11px;font-weight:700;letter-spacing:.06em;padding:4px 8px;border-radius:6px;white-space:nowrap;flex:none}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.today{background:var(--accent);color:var(--accent-ink)}
.note{display:flex;gap:8px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.note svg{flex:none;width:16px;height:16px;margin-top:2px}
.empty{padding:16px 14px;color:var(--muted);font-size:14px}

/* announcements — same card formatting as each team app, minus the collapsible toggle */
.ann-list{display:flex;flex-direction:column;gap:10px}
.ann-card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--t);border-radius:var(--r);padding:12px 12px 12px 14px}
.ann-card.ann-today{border:2px solid var(--accent);border-left:4px solid var(--t);background:linear-gradient(135deg,var(--accent-soft),var(--surface) 70%);box-shadow:0 6px 22px -12px var(--accent)}
.ann-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.ann-tlabel{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--t)}
.ann-title{font-weight:700;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere;margin:0}
.ann-text{margin:0;white-space:pre-line;color:var(--muted);font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.pill.today-pill{background:var(--accent);color:var(--accent-ink);font-weight:800}
.pill.new-pill{background:var(--accent);color:var(--accent-ink);font-size:10.5px;padding:1px 7px;vertical-align:2px;margin-right:4px}
.flyer{display:block;flex:none;width:clamp(84px,28%,140px);padding:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface-2);cursor:zoom-in}
.flyer img{display:block;width:100%;height:auto;max-height:200px;object-fit:cover;object-position:top;background:var(--surface-2)}
.flyer-load{display:block;padding:18px 6px;color:var(--muted);font-size:12px;font-weight:500;text-align:center}
.lightbox{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.9);display:flex;align-items:center;justify-content:center;padding:calc(48px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:6px}
.lb-close{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));width:40px;height:40px;border-radius:50%;border:none;background:rgba(255,255,255,.15);color:#fff;font-size:26px;line-height:1}

/* calendar */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 12px;border-radius:17px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:12.5px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--t)}
.chip.off{opacity:.45}
.chip.off .dot{background:transparent;border:1.5px solid var(--t)}
.cal{padding:12px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-head b{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.04em;text-transform:uppercase}
.cal-head .iconbtn{border:0;background:var(--surface-2);color:var(--fg)}
.dow,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.dow{text-align:center;font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.06em;padding-bottom:4px}
.day{height:46px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border-radius:10px;border:0;background:transparent;font-size:14px;font-weight:500;padding:0}
.day.today{color:var(--accent);font-weight:800}
.day.sel{background:var(--navy);color:#FFFFFF;font-weight:700}
:root[data-theme="dark"] .day.sel{background:var(--accent);color:var(--accent-ink)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .day.sel{background:var(--accent);color:var(--accent-ink)}}
.day .dots{display:flex;gap:3px;height:6px}
.day .dots i{width:6px;height:6px;border-radius:50%;background:var(--t)}
.day.sel .dots i{box-shadow:0 0 0 1.5px #FFFFFF}
.day.blank{visibility:hidden}

/* teams list + profile */
.tcard{display:flex;align-items:center;gap:12px;padding:14px;text-decoration:none;color:var(--fg)}
.tcard .info{flex:1;min-width:0}
.tcard .info b{display:block;font-size:16px}
.tcard .info small{display:block;font-size:12.5px;color:var(--muted)}
.prof{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:16px}
.prof .hint{flex-basis:100%;margin-top:2px}
.prof .av{width:64px;height:64px;border-radius:50%;border:2px solid var(--accent);background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:22px;overflow:hidden;flex:none}
.prof .av img{width:100%;height:100%;object-fit:cover}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--surface-2);background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;color:var(--fg);font-weight:600}
.setrow:last-child{border-bottom:0}
.alert{border:2px solid var(--bad)}
.install{border-color:var(--accent);background:var(--accent-soft)}
.install ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.install .acts2{display:flex;gap:8px;flex-wrap:wrap}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding-top:6px;padding-bottom:6px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;color:var(--muted);font-size:10px;font-weight:600;min-height:50px;padding:4px 2px;position:relative;line-height:1.15}
nav.tabs .tab-label{display:block;text-align:center;max-width:100%;overflow-wrap:break-word;word-break:break-word}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:700}
nav.tabs .count{position:absolute;top:0;left:calc(50% + 6px);min-width:18px;height:18px;font-size:10.5px;padding:0 5px}

.center{min-height:62vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.center .wm{width:min(240px,70%);height:auto}
.center p{max-width:380px;margin:0;color:var(--muted)}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{font-size:12px;color:var(--bad);background:var(--bad-soft);padding:8px 10px;border-radius:8px;max-width:420px;word-break:break-word}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--navy);color:#FFFFFF;padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;max-width:min(92vw,440px);box-shadow:0 8px 24px rgba(3,17,31,.3)}
.toast.bad{background:var(--bad)}
.updating{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.updating .spinner{width:12px;height:12px;border-width:2px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" hidden></div>
<script>
/* ============================================================
   RCI Serve — one home for the four RCI team apps.
   It lives at the top of astmacary.github.io, so the team apps
   (/rci-productions/, /rci-security/, /rci-ushers/, /rci-worship-arts/)
   open inside the same installed app, with the same sign-in.
   It reads each team's SharePoint list with that app's own rules.
   ============================================================ */
const APP_VERSION = "12";   // bump together with CACHE in sw.js
const CONFIG = {
  clientId: "cd20cb76-a6e8-47fa-9abf-c8e17fb5594d",   // the "RCI Productions" Entra app registration (shared by all the apps)
  tenantId: "4351910e-4abe-4ff8-a519-ce7ac8cad567",
  siteHost: "xb3hc3233xdwtuxk4m6un8xymmy.sharepoint.com",
  appHosts: ["astmacary.github.io", "serve.therampchurch.com"]
};
// The four team apps. Colors: tl = light mode, td = dark mode. Editors copied from each app's CONFIG.editors.
const TEAMS = [
  { key: "productions", name: "Productions", full: "RCI Productions", path: "/rci-productions/", tl: "#0B3A6E", td: "#6FA4E0", icon: "cam",
    sitePath: "/sites/RCIProductions", listId: "01c57f63-f693-4a25-bd83-18ef8c5b6ecd", announcementsListId: "35549622-4738-4fff-9b07-15e0255df762",
    editors: ["ashley.stmacary@therampchurch.com", "ward.shaquille93@gmail.com", "morgandmosby@gmail.com"] },
  { key: "security", name: "Security", full: "RCI Security", path: "/rci-security/", tl: "#7A1F1F", td: "#EB9393", icon: "shield",
    sitePath: "/sites/RCISecurity", listName: "Security Schedule", announcementsListName: "Announcements",
    editors: ["delisa.rogers@therampchurch.com", "hal.hanson@therampchurch.com", "halrhansonjr@gmail.com", "lee.gilbert@therampchurch.com", "gilbertwilfred7@gmail.com", "ashley.stmacary@therampchurch.com"] },
  { key: "ushers", name: "Ushers & Altar", full: "RCI Ushers & Altar Workers", path: "/rci-ushers/", tl: "#1E5E43", td: "#6CC69C", icon: "door",
    sitePath: "/sites/RCIUsherDept.-UsherSchedule", listName: "Usher Schedule", announcementsListName: "Announcements",
    editors: ["delisa.rogers@therampchurch.com", "ashley.stmacary@therampchurch.com", "tammyrambler@gmail.com"] },
  { key: "worship", name: "Worship & Arts", full: "RCI Worship & Arts", path: "/rci-worship-arts/", tl: "#4A2F7A", td: "#B9A1EA", icon: "music",
    sitePath: "/sites/RCIMusicDept", listId: "ce2715b8-f330-4471-8e20-adeae324d21c", announcementsListId: "e912e877-d00e-4971-bcd4-df25f621f03d",
    editors: ["ashley.stmacary@therampchurch.com", "cassie.carter.inc@gmail.com"] }
];

/* The Announcements column can hold several lines; SharePoint may return it as plain text or simple HTML. Same as each team app. */
function annText(v){
  if (!v) return "";
  if (!/<[a-z][\s\S]*>/i.test(v)) return v.trim();
  const d = new DOMParser().parseFromString(v.replace(/<br\s*\/?>/gi, "\n").replace(/<\/(p|div|li)>/gi, "\n"), "text/html");
  return (d.body.textContent || "").replace(/\n{3,}/g, "\n\n").trim();
}

const KEEP = new Set(["B","STRONG","I","EM","U","UL","OL","LI","BR","P","DIV","SPAN","A","BLOCKQUOTE"]);
function cleanHtml(raw){
  const doc = new DOMParser().parseFromString(`<div>${raw}</div>`, "text/html");
  const walk = node => {
    [...node.childNodes].forEach(n => {
      if (n.nodeType === 3) return;
      if (n.nodeType !== 1 || /^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|NOSCRIPT|TEMPLATE)$/.test(n.tagName)){ n.remove(); return; }
      walk(n);
      if (!KEEP.has(n.tagName)){
        if (n.tagName === "FONT" && n.getAttribute("color")) safeStyle(n, `color:${n.getAttribute("color")}`, "SPAN");
        else n.replaceWith(...n.childNodes);
        return;
      }
      const href = n.tagName === "A" ? n.getAttribute("href") : null;
      const style = n.getAttribute("style");
      [...n.attributes].forEach(a => n.removeAttribute(a.name));
      if (href && /^https?:\/\//i.test(href)){ n.setAttribute("href", href); n.setAttribute("target","_blank"); n.setAttribute("rel","noopener"); }
      if (style) safeStyle(n, style);
    });
  };
  const root = doc.body.firstChild; walk(root);
  return root.innerHTML;
}
function safeStyle(n, style, renameTo){
  const out = [];
  const color = style.match(/(?:^|;)\s*color\s*:\s*(#[0-9a-fA-F]{3,8}|rgb\(\s*\d{1,3}\s*,\s*\d{1,3}\s*,\s*\d{1,3}\s*\))\s*(?:;|$)/i);
  if (color) out.push(`color:${color[1]}`);
  const margin = style.match(/(?:^|;)\s*margin(-left)?\s*:\s*((?:\d{1,4}(?:\.\d+)?(?:px|em)?\s*){1,4})(?:;|$)/i);
  if (margin) out.push(`margin${margin[1] || ""}:${margin[2].trim()}`);
  if (out.length){
    if (renameTo){ const r = n.ownerDocument.createElement(renameTo); r.append(...n.childNodes); r.setAttribute("style", out.join(";")); n.replaceWith(r); }
    else n.setAttribute("style", out.join(";"));
  } else if (renameTo) n.replaceWith(...n.childNodes);
}

const API = {
  msal: null, account: null, sites: {},
  async init(){
    const msal = await import("https://cdn.jsdelivr.net/npm/@azure/msal-browser@3.27.0/+esm");
    this.msal = new msal.PublicClientApplication({
      auth: { clientId: CONFIG.clientId, authority: "https://login.microsoftonline.com/" + CONFIG.tenantId, redirectUri: location.origin + "/" },
      cache: { cacheLocation: "localStorage" }   // the same place the team apps keep their sign-in, so one sign-in covers all of them
    });
    await this.msal.initialize();
    const r = await this.msal.handleRedirectPromise();
    this.account = r?.account || this.msal.getActiveAccount() || this.msal.getAllAccounts()[0] || null;
    if (this.account) this.msal.setActiveAccount(this.account);
    return !!this.account;
  },
  signIn(){ return this.msal.loginRedirect({ scopes: SCOPES, redirectUri: location.origin + "/" }); },
  signOut(){ return this.msal.logoutRedirect({ account: this.account, postLogoutRedirectUri: location.origin + "/" }); },
  async token(){
    try { return (await this.msal.acquireTokenSilent({ scopes: SCOPES, account: this.account })).accessToken; }
    catch(e){ await this.msal.acquireTokenRedirect({ scopes: SCOPES, redirectUri: location.origin + "/" }); throw e; }
  },
  async g(path, opts={}){
    const url = path.startsWith("https://") ? path : "https://graph.microsoft.com/v1.0" + path;
    const res = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + await this.token(), ...(opts.headers||{}) } });
    if (!res.ok){
      let detail = ""; try { detail = (await res.json()).error?.message || ""; } catch(e){}
      const err = new Error(`${res.status} ${detail || res.statusText}`); err.status = res.status; throw err;
    }
    return opts.raw ? res : (res.status === 204 ? null : res.json());
  },
  async all(path){ let out = [], next = path; while (next){ const j = await this.g(next); out = out.concat(j.value || []); next = j["@odata.nextLink"]; } return out; },
  async me(){
    const me = await this.g("/me?$select=displayName,mail,userPrincipalName");
    return { name: me.displayName || this.account.name || "", emails: [...new Set([me.mail, me.userPrincipalName, this.account.username].filter(Boolean).map(lc))] };
  },
  async photo(){
    try { const r = await this.g("/me/photo/$value", { raw: true }); return URL.createObjectURL(await r.blob()); } catch(e){ return null; }
  },
  /* Loads one team's rows. Throws an error with .noAccess when the person can't open that team's site. */
  async team(t){
    try { return await this.teamRows(t); }
    catch(e){ if (e.status === 403 || e.status === 404 || e.status === 401) e.noAccess = true; throw e; }
  },
  async teamRows(t){
    const site = await this.g(`/sites/${CONFIG.siteHost}:${t.sitePath}?$select=id`);
    const base = `/sites/${site.id}/lists`;
    const listId = t.listId || (await this.g(`${base}/${encodeURIComponent(t.listName)}?$select=id`)).id;
    const emailById = {};
    try {
      const users = await this.all(`${base}/${encodeURIComponent("User Information List")}/items?$expand=fields($select=EMail,UserName)&$top=999`);
      users.forEach(u => { emailById[u.id] = lc(u.fields.EMail || u.fields.UserName || ""); });
    } catch(e){ console.warn(t.name + ": couldn't read the site's user list; matching by name.", e); }
    const col = {};
    let sel;
    if (t.key === "productions") sel = "Title,ServiceDates,ServiceCategory,CallTime,ServiceTime,ChoiceNames,PersonLookupId,Status,Published,ArchiveStatus";
    else if (t.key === "worship") sel = "Title,ServiceDate,ServiceCategory,CallTime,ServiceTime,FullName,NameEmailLookupId,Status,Published,LeaderPositions,SingingPositions,MusicianPositions";
    else {
      // Security and Ushers: find each column by its internal name, then by its display name (same as those apps do).
      const COLS = {
        ServiceDate: ["Service Date"], Name: ["Name"], SecurityName: ["Security Name", "Usher's Name", "Usher’s Name", "Ushers Name", "Usher Name"],
        Placement: ["Placement", "Usher Placement"], Placement2: ["Placement2", "Altar Worker Placement"],
        Status2: ["Placement 2 Status", "Placement2 Status", "Altar Worker Placement Status", "Altar Worker Status"],
        Status: ["Status"], ServiceCategory: ["Service Category"], CallTime: ["Call Time"], ArchiveStatus: ["Archive Status"]
      };
      let cols = [];
      try { cols = (await this.g(`${base}/${listId}/columns?$select=name,displayName`)).value || []; } catch(e){}
      const norm = v => lc(v).replace(/[’']/g, "'");
      for (const [k, labels] of Object.entries(COLS)){
        const hit = cols.find(c => c.name === k) || cols.find(c => labels.map(norm).includes(norm(c.displayName)));
        if (hit) col[k] = hit.name; else if (!cols.length && k !== "Placement2" && k !== "Status2") col[k] = k;
      }
      sel = ["Title", ...Object.entries(col).map(([k, v]) => k === "Name" ? v + "LookupId" : v)].join(",");
    }
    const raw = await this.all(`${base}/${listId}/items?$expand=fields($select=${sel})&$top=500`);
    let annListId = t.announcementsListId || null;
    if (!annListId && t.announcementsListName){
      try { annListId = (await this.g(`${base}/${encodeURIComponent(t.announcementsListName)}?$select=id`)).id; }
      catch(e){ console.warn(t.name + ": no \"" + t.announcementsListName + "\" list on this site.", e); }
    }
    let announcements = [];
    if (annListId){
      try {
        const rows = await this.all(`${base}/${annListId}/items?$expand=fields($select=Title,Announcements,ShowUntil,Flyer)&$top=200`);
        announcements = rows.map(r => ({ id: Number(r.id), created: r.createdDateTime || "", text: annText(r.fields.Announcements) || r.fields.Title || "", until: spDate(r.fields.ShowUntil), flyer: r.fields.Flyer || "" }));
      } catch(e){ console.warn(t.name + ": couldn't read Announcements.", e); }
    }
    this.sites[t.key] = { siteId: site.id, listId, col, annListId };
    return { items: raw.flatMap(r => normalize(t, String(r.id), r.fields, emailById, col)), announcements };
  },
  /* The church-wide calendar: a simple list (Title + one date column) on its own site, no membership to check.
     The date column's internal name varies by list, so it's found by type rather than guessed. */
  async churchMeta(){
    if (this._churchMeta) return this._churchMeta;
    const site = await this.g(`/sites/${CONFIG.siteHost}:${CHURCH_CAL.sitePath}?$select=id`);
    const base = `/sites/${site.id}/lists`;
    const listId = (await this.g(`${base}/${encodeURIComponent(CHURCH_CAL.listName)}?$select=id`)).id;
    const cols = (await this.g(`${base}/${listId}/columns?$select=name,displayName,dateTime,hidden,readOnly`)).value || [];
    const dateCol = cols.find(c => c.dateTime && !c.hidden && !c.readOnly) || cols.find(c => c.dateTime);
    if (!dateCol) throw new Error("Church Calendar: couldn't find a date column");
    return (this._churchMeta = { base, listId, dateCol: dateCol.name });
  },
  async churchEvents(){
    const { base, listId, dateCol } = await this.churchMeta();
    const rows = await this.all(`${base}/${listId}/items?$expand=fields($select=Title,${dateCol})&$top=500`);
    return rows.map(r => ({ id: "church-" + r.id, rowId: r.id, date: spDate(r.fields[dateCol]), title: r.fields.Title || "" }))
      .filter(e => e.date);
  },
  async churchCreate(title, date){
    const { base, listId, dateCol } = await this.churchMeta();
    const r = await this.g(`${base}/${listId}/items`, { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ fields: { Title: title, [dateCol]: date + "T00:00:00" } }) });
    return { id: "church-" + r.id, rowId: r.id, date, title };
  },
  async churchUpdate(rowId, title, date){
    const { base, listId, dateCol } = await this.churchMeta();
    await this.g(`${base}/${listId}/items/${rowId}/fields`, { method: "PATCH", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ Title: title, [dateCol]: date + "T00:00:00" }) });
  },
  async churchDelete(rowId){
    const { base, listId } = await this.churchMeta();
    await this.g(`${base}/${listId}/items/${rowId}`, { method: "DELETE" });
  },
  /* Resolves a team's Announcements list, using the cache teamRows() already filled in when it's there. */
  async resolveAnnList(t){
    if (this.sites[t.key]?.annListId) return { siteId: this.sites[t.key].siteId, annListId: this.sites[t.key].annListId };
    const site = await this.g(`/sites/${CONFIG.siteHost}:${t.sitePath}?$select=id`);
    const base = `/sites/${site.id}/lists`;
    let annListId = t.announcementsListId || null;
    if (!annListId && t.announcementsListName){ try { annListId = (await this.g(`${base}/${encodeURIComponent(t.announcementsListName)}?$select=id`)).id; } catch(e){} }
    return { siteId: site.id, annListId };
  },
  /* Upload an image to the site's Site Assets library and return the value for a SharePoint image (Thumbnail) column. */
  async assetImage(siteId, listId, fileName, blob){
    const drives = await this.g(`/sites/${siteId}/drives?$select=id,name,webUrl`);
    const assets = drives.value.find(d => /\/SiteAssets$/i.test(d.webUrl)) || drives.value.find(d => /site assets/i.test(d.name))
      || await this.g(`/sites/${siteId}/lists/${encodeURIComponent("Site Assets")}/drive?$select=id,name,webUrl`).catch(() => null);
    if (!assets) throw new Error("Couldn't find the site's Site Assets library.");
    const up = await this.g(`/drives/${assets.id}/root:/Lists/${listId}/${fileName}:/content`, { method: "PUT", headers: { "Content-Type": "image/jpeg" }, body: blob });
    const u = new URL(up.webUrl);
    return JSON.stringify({ type: "thumbnail", fileName, serverUrl: u.origin, serverRelativeUrl: decodeURIComponent(u.pathname) });
  },
  async announcementPush(t, { title, text, until, flyerBlob, flyerName }){
    const { siteId, annListId } = await this.resolveAnnList(t);
    if (!annListId) throw new Error(`No Announcements list found on ${t.name}`);
    const fields = { Title: (title || text.split("\n")[0] || "Announcement").slice(0, 120), Announcements: text };
    if (until) fields.ShowUntil = until + "T00:00:00";
    const r = await this.g(`/sites/${siteId}/lists/${annListId}/items`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ fields }) });
    if (flyerBlob){
      try {
        const flyer = await this.assetImage(siteId, annListId, `flyer-${r.id}-${flyerName || "flyer.jpg"}`, flyerBlob);
        await this.g(`/sites/${siteId}/lists/${annListId}/items/${r.id}/fields`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Flyer: flyer }) });
      } catch(e){ /* announcement is posted either way; the flyer image column is a nice-to-have */ }
    }
  },
  /* Production Notes: keeps whatever text was before the "SET LIST" marker on the existing Production Director row for that date — same as the Productions app's own save. */
  async pushProductionNotes(date, bodyHtml){
    const row = (S.teams.productions?.items || []).find(i => i.kind === "assign" && i.role === "Production Director" && i.date === date);
    if (!row) throw new Error(`No Production Director is scheduled for ${fmtShort(date)} yet, so there's no row to save notes on.`);
    const s = this.sites.productions;
    if (!s) throw new Error("Productions hasn't loaded yet. Refresh and try again.");
    const cur = await this.g(`/sites/${s.siteId}/lists/${s.listId}/items/${row.rowId}/fields?$select=Notes`);
    const all = cur.Notes || "", at = all.indexOf("SET LIST");
    const before = at >= 0 ? all.slice(0, at) : "";
    await this.g(`/sites/${s.siteId}/lists/${s.listId}/items/${row.rowId}/fields`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Notes: before + bodyHtml }) });
  },
  /* Worship Notes: a Coordinator row per date shows everything, so pushing replaces it outright, creating the row if one isn't there yet. */
  async pushWorshipNotes(date, bodyHtml){
    const row = (S.teams.worship?.items || []).find(i => i.kind === "other" && i.role === "Coordinator" && i.date === date);
    const s = this.sites.worship;
    if (!s) throw new Error("Worship & Arts hasn't loaded yet. Refresh and try again.");
    if (row){
      await this.g(`/sites/${s.siteId}/lists/${s.listId}/items/${row.rowId}/fields`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ Notes: bodyHtml }) });
    } else {
      await this.g(`/sites/${s.siteId}/lists/${s.listId}/items`, { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ fields: { Title: "Coordinator", ServiceDate: date + "T12:00:00Z", ActiveStatus: "Non Active", Published: "--", Notes: bodyHtml } }) });
    }
  },
  async update(teamKey, rowId, fields){
    const s = this.sites[teamKey];
    await this.g(`/sites/${s.siteId}/lists/${s.listId}/items/${rowId}/fields`, { method: "PATCH", headers: { "Content-Type": "application/json" }, body: JSON.stringify(fields) });
  },
  /* SharePoint's own API is needed for flyer images stored as row attachments (Graph can't read those). Same as each team app. */
  spOff: false, flyerCache: new Map(),
  async spToken(){
    if (this.spOff) return null;
    try { return (await this.msal.acquireTokenSilent({ scopes: [`https://${CONFIG.siteHost}/AllSites.Read`], account: this.account })).accessToken; }
    catch(e){ console.warn("SharePoint flyer access isn't approved yet (AllSites.Read).", e); this.spOff = true; return null; }
  },
  async spBlob(t, path){
    const tok = await this.spToken(); if (!tok) throw new Error("no SharePoint token");
    const res = await fetch(`https://${CONFIG.siteHost}${t.sitePath}/_api/web/${path}`, { headers: { Authorization: "Bearer " + tok } });
    if (!res.ok) throw new Error(res.status);
    return URL.createObjectURL(await res.blob());
  },
  flyer(t, a){
    const k = t.key + "|" + a.id + "|" + a.flyer;
    if (!this.flyerCache.has(k)) this.flyerCache.set(k, (async () => {
      const annListId = this.sites[t.key]?.annListId; if (!annListId) return null;
      try {
        const f = JSON.parse(a.flyer), q = v => encodeURIComponent(String(v).replace(/'/g, "''"));
        if (f.serverRelativeUrl) return await this.spBlob(t, `GetFileByServerRelativeUrl('${q(f.serverRelativeUrl)}')/$value`);
        if (f.fileName) return await this.spBlob(t, `lists(guid'${annListId}')/items(${a.id})/AttachmentFiles('${q(f.fileName)}')/$value`);
      } catch(e){}
      return null;
    })());
    return this.flyerCache.get(k);
  }
};

/* One shape for every team's rows. kind: "profile" (Roster / Birthday row), "assign" (a position on a date), or "other". */
function normalize(t, id, f, emailById, col){
  const base = { team: t.key, rowId: id, id: t.key + ":" + id, slot: 1 };
  if (t.key === "productions"){
    const cat = f.ServiceCategory || "";
    const kind = cat === "🎂 Birthday" ? "profile" : (!f.ServiceDates || /^(absent|no service)$/i.test(cat)) ? "other" : "assign";
    return [{ ...base, kind, date: spDate(f.ServiceDates), category: cat, role: f.Title || "", fullName: f.ChoiceNames || "",
      email: emailById[f.PersonLookupId] || "", call: f.CallTime || "", time: f.ServiceTime || "",
      pending: f.Status === "Pending" && f.Published === "Request Sent",
      confirmed: f.Status === "Accepted" && f.Published === "Request Approved",
      gone: lc(f.ArchiveStatus) === "archived" }];
  }
  if (t.key === "worship"){
    const cat = f.ServiceCategory || "";
    const positions = ["LeaderPositions", "SingingPositions", "MusicianPositions"].flatMap(c => Array.isArray(f[c]) ? f[c] : (f[c] ? [f[c]] : []));
    const role = positions.join(" · ") || f.Title || "";
    const profile = cat === "Birthday" || cat === "🎂 Birthday" || (!cat && !f.ServiceDate && !!f.FullName);
    const notesHolder = !!f.ServiceDate && lc(f.Title) === "coordinator" && !f.FullName && !positions.length;
    const kind = profile ? "profile" : (!f.ServiceDate || notesHolder || /^(absent|no service)$/i.test(cat)) ? "other" : "assign";
    return [{ ...base, kind, date: spDate(f.ServiceDate), category: cat, role, fullName: f.FullName || "",
      email: emailById[f.NameEmailLookupId] || "", call: f.CallTime || "", time: f.ServiceTime || "",
      pending: f.Status === "Pending" && f.Published === "Request Sent",
      confirmed: f.Status === "Accepted" && f.Published === "Request Approved",
      gone: !f.ServiceDate && lc(f.Status) === "unavailable" }];
  }
  // Security and Ushers share a shape; Ushers rows can hold a second (Altar Worker) request.
  const g = k => col[k] ? f[col[k]] : undefined;
  const dateRaw = g("ServiceDate"), cat = g("ServiceCategory") || "", call = g("CallTime") || "";
  const roster = !dateRaw && !cat && !call;
  const name = g("SecurityName") || "", status = g("Status") || "";
  const email = emailById[f[(col.Name || "Name") + "LookupId"]] || "";
  const common = { ...base, date: dateRaw ? spDate(dateRaw) : "", category: roster ? "" : cat, fullName: name, email, call, time: "" };
  if (roster) return [{ ...common, kind: "profile", role: "", pending: false, confirmed: false,
    gone: t.key === "security" ? lc(g("ArchiveStatus")) === "archive" : lc(status) === "unavailable" }];
  const kind = (!dateRaw || lc(cat) === "no service") ? "other" : "assign";
  const p1 = g("Placement") || "", p2 = g("Placement2") || "", st2 = g("Status2") || "";
  const req = (role, st) => lc(st) === "pending" && filled(cat) && filled(name) && filled(role);
  const out = [];
  if (t.key === "security" || filled(p1) || !filled(p2))
    out.push({ ...common, kind, role: p1, status, pending: req(p1, status), confirmed: lc(status) === "accepted", gone: false });
  if (t.key === "ushers" && filled(p2))
    out.push({ ...common, kind, id: common.id + ":2", slot: 2, role: p2, pending: req(p2, st2 || "Pending"), confirmed: lc(st2) === "accepted", gone: false });
  return out;
}

/* What "Accept" writes, per team (the same as each app's own Accept button). */
function acceptFields(item){
  if (item.team === "productions" || item.team === "worship") return { Status: "Accepted", Published: "Request Approved" };
  if (item.team === "ushers" && item.slot === 2) return { [API.sites.ushers.col.Status2]: "Accepted" };
  return { [API.sites[item.team]?.col?.Status || "Status"]: "Accepted" };
}

const S = { phase: "boot", error: "", me: null, photo: null, view: "home", teams: {}, church: { items: [], error: "" }, loading: false, loadedAt: 0,
            busy: new Set(), cal: { month: null, sel: null, off: new Set(), form: null, busy: false }, hideInstall: false,
            annForm: null, notesForm: null };
/* Teams this signed-in person can "Send to": only the ones they actually admin. */
const sendableTeams = () => TEAMS.filter(isEditorOf);
const NOTES_TARGETS = [{ key: "production-notes", label: "Production Notes", team: () => TEAMS.find(t => t.key === "productions") },
                        { key: "worship-notes", label: "Worship Notes", team: () => TEAMS.find(t => t.key === "worship") }];
const sendableNotesTargets = () => NOTES_TARGETS.filter(n => isEditorOf(n.team()));
const mineRow = i => (i.email && S.me.emails.includes(lc(i.email))) || (!i.email && i.fullName && lc(i.fullName) === lc(S.me.name));
const isEditorOf = t => !!S.me && t.editors.some(e => S.me.emails.includes(lc(e)));
/* On a team: an admin of it, has a (not archived) Roster / profile row, or has been scheduled in the last 120 days or later. */
function member(t){
  const d = S.teams[t.key]; if (!d) return false;
  if (isEditorOf(t)) return true;
  if (d.noAccess || !d.items) return false;
  const since = addDays(todayKey(), -120);
  return d.items.some(i => mineRow(i) && ((i.kind === "profile" && !i.gone) || (i.kind === "assign" && i.date >= since)));
}
const myTeams = () => TEAMS.filter(member);
const myItems = () => myTeams().flatMap(t => (S.teams[t.key].items || []).filter(i => i.kind === "assign" && mineRow(i) && (i.pending || i.confirmed)));
const upcoming = () => myItems().filter(i => i.date >= todayKey()).sort((a,b) => a.date.localeCompare(b.date) || a.team.localeCompare(b.team));
const pendingOf = k => upcoming().filter(i => i.pending && (!k || i.team === k));
const totalPending = () => pendingOf().length;

/* Shared with the team apps (same address): who's signed in, which teams they're on, and each team's request count.
   The team apps read this to show the Switch Team button and to add the other teams' counts to the app-icon number. */
function saveShared(){
  if (!S.me) return;
  try {
    const teams = myTeams().map(t => ({ key: t.key, count: S.teams[t.key]?.items ? pendingOf(t.key).length : 0, admin: isEditorOf(t) }));
    localStorage.setItem("rci-serve:state", JSON.stringify({ emails: S.me.emails, name: S.me.name, at: Date.now(), teams }));
  } catch(e){}
}
function saveCache(){
  try {
    const teams = {};
    for (const t of TEAMS){ const d = S.teams[t.key]; if (!d) continue;
      teams[t.key] = { noAccess: !!d.noAccess, error: d.error || "", items: (d.items || []).filter(i => mineRow(i)), announcements: d.announcements || [] }; }
    localStorage.setItem("rci-serve:cache", JSON.stringify({ me: S.me, at: Date.now(), teams, church: S.church.items || [] }));
  } catch(e){}
}
function readCache(){
  try { const c = JSON.parse(localStorage.getItem("rci-serve:cache") || "null"); return c && c.me ? c : null; } catch(e){ return null; }
}
function updateBadge(){
  saveShared();
  if (DEMO || !("setAppBadge" in navigator)) return;
  const n = totalPending();
  (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
}

async function loadAll(){
  if (S.loading) return;
  S.loading = true; render();
  if (DEMO){
    const d = demoTeams(); S.me = d.me; S.teams = d.teams; S.church = { items: d.church, error: "" };
  } else {
    const [results, churchResult] = await Promise.all([
      Promise.allSettled(TEAMS.map(t => API.team(t))),
      Promise.allSettled([API.churchEvents()])
    ]);
    const next = {};
    results.forEach((r, n) => {
      const t = TEAMS[n];
      if (r.status === "fulfilled") next[t.key] = { items: r.value.items, announcements: r.value.announcements };
      else if (r.reason?.noAccess) next[t.key] = { noAccess: true, items: [], announcements: [] };
      else { console.warn(t.name, r.reason); next[t.key] = { error: r.reason?.message || "Couldn't load", items: S.teams[t.key]?.items || null, announcements: S.teams[t.key]?.announcements || [] }; }
    });
    S.teams = next;
    const cr = churchResult[0];
    if (cr.status === "fulfilled") S.church = { items: cr.value, error: "" };
    else { console.warn("Church Calendar", cr.reason); S.church = { items: S.church.items || [], error: cr.reason?.message || "Couldn't load" }; }
    saveCache();
  }
  S.loading = false; S.loadedAt = Date.now(); S.phase = "ready";
  if (!S.cal.sel){ const first = upcoming()[0]; S.cal.sel = first && first.date <= addDays(todayKey(), 31) ? first.date : todayKey(); }
  updateBadge(); render();
}

async function accept(id){
  const item = myItems().find(i => i.id === id); if (!item || S.busy.has(id)) return;
  S.busy.add(id); render();
  try {
    if (!DEMO) await API.update(item.team, item.rowId, acceptFields(item));
    item.pending = false; item.confirmed = true;
    toast(`Accepted: ${item.role}, ${fmtShort(item.date)}`);
    saveCache();
  } catch(e){ toast("Couldn't save your reply. " + e.message, true); }
  S.busy.delete(id); updateBadge(); render();
}

/* ---------- Church calendar: add / edit / delete / no-service (editors only) ---------- */
async function churchSave(){
  const f = S.cal.form; if (!f || S.cal.busy) return;
  const title = (document.querySelector('[data-field="title"]')?.value || "").trim();
  const date = document.querySelector('[data-field="date"]')?.value || "";
  if (!title || !date) { toast("A title and date are both needed.", true); return; }
  f.title = title; f.date = date;
  S.cal.busy = true; render();
  try {
    if (f.mode === "add"){
      const e = DEMO ? { id: "church-" + Date.now(), rowId: "demo-" + Date.now(), date, title } : await API.churchCreate(title, date);
      S.church.items = [...(S.church.items || []), e];
      for (const k of (f.targets || [])){
        const t = TEAMS.find(x => x.key === k); if (!t || !isEditorOf(t)) continue;
        if (!DEMO) await API.announcementPush(t, { title, text: `${title} — ${fmtShort(date)}`, until: date }).catch(() => {});
      }
      toast(`Added: ${title}, ${fmtShort(date)}`);
    } else {
      if (!DEMO) await API.churchUpdate(f.rowId, title, date);
      const i = S.church.items.find(x => x.rowId === f.rowId);
      if (i){ i.title = title; i.date = date; }
      toast(`Saved: ${title}, ${fmtShort(date)}`);
    }
    S.cal.sel = date; S.cal.month = date.slice(0, 7); S.cal.form = null; saveCache();
  } catch(e){ toast("Couldn't save. " + e.message, true); }
  S.cal.busy = false; render();
}
async function churchRemove(rowId){
  if (S.cal.busy) return;
  S.cal.busy = true; render();
  try {
    if (!DEMO) await API.churchDelete(rowId);
    S.church.items = (S.church.items || []).filter(x => x.rowId !== rowId);
    toast("Removed");
    saveCache();
  } catch(e){ toast("Couldn't remove it. " + e.message, true); }
  S.cal.busy = false; render();
}
/* The red-X toggle: adds (or removes) a plain "No Service" entry on the selected day. */
async function churchToggleNoService(){
  if (S.cal.busy) return;
  const date = S.cal.sel;
  const existing = (S.church.items || []).find(x => x.date === date && lc(x.title) === "no service");

    toast(`Marked No Service: ${fmtShort(date)}`);

}

function teamTile(t){
  const d = S.teams[t.key] || {}, n = d.items ? pendingOf(t.key).length : 0;
  const next = upcoming().find(i => i.team === t.key && i.confirmed);
  let line;
  if (d.error && !d.items) line = `<small>Couldn't load. Tap to open.</small>`;
  else if (n) line = `<small class="hot">${n} need${n === 1 ? "s" : ""} a reply</small>`;
  else if (next) line = `<small>Serving ${next.date === todayKey() ? "today" : next.date <= addDays(todayKey(), 6) ? fromKey(next.date).toLocaleDateString(undefined, {weekday:"short"}) : fmtShort(next.date)}</small>`;

/* Announcements across every team the person is on, soonest "Show Until" first (no end date = last, oldest first) — same ordering as each team app. */
function myAnnouncements(){
  const t = todayKey();
  return myTeams().flatMap(team => (S.teams[team.key]?.announcements || [])
    .filter(a => a.text && (!a.until || a.until >= t)).map(a => ({ ...a, team: team.key })))
    .sort((a, b) => (a.until || "9999-12-31").localeCompare(b.until || "9999-12-31") || a.team.localeCompare(b.team) || a.id - b.id);
}
/* "NEW" tag: announcements added since this person last opened Announcements on this device. */
function markNewAnns(list){
  const key = "rci-serve:anns-seen:" + ((S.me && S.me.emails && S.me.emails[0]) || "");
  let last = 0; try { last = Number(localStorage.getItem(key)) || 0; } catch(e){}
  if (!last) last = Date.now() - 7 * 864e5;
  const fresh = new Set();
  list.forEach(a => { const d = Date.parse(a.created || ""); if (d && d > last) fresh.add(team_id(a)); });
  try { localStorage.setItem(key, String(Date.now())); } catch(e){}
  return fresh;
}
const team_id = a => a.team + ":" + a.id;
function annCard(a, isNew){
  const t = teamOf(a.team);

  return `<article class="ann-card team${annToday(a) ? " ann-today" : ""}" style="${tvars(t)}">

  const body = (S.view === "announcements" && SHOW_ANNOUNCEMENTS) ? viewAnnouncements() : S.view === "calendar" ? viewCalendar() : (S.view === "giving" && SHOW_GIVING) ? viewGiving()
    : S.view === "teams" ? viewTeams() : S.view === "profile" ? viewProfile() : viewHome();
  const tabs = `<nav class="tabs" aria-label="Main"><div class="wrap" style="grid-template-columns:repeat(${tabsArr.length},minmax(0,1fr))">${tabsArr.map(([v, l, ic]) =>
    `<button data-act="tab" data-view="${v}"${S.view === v ? ' aria-current="page"' : ""}>${ic}<span class="tab-label">${l}</span>${v === "home" && n ? `<span class="count" aria-hidden="true">${n}</span>` : ""}</button>`).join("")}</div></nav>`;
  app.innerHTML = header + `<main><div class="wrap">${body}</div></main>` + tabs;
  hydrateFlyers();
}
function hydrateFlyers(){
  document.querySelectorAll("[data-flyer]").forEach(async el => {
    const [teamKey, id] = el.dataset.flyer.split(":");
    const t = teamOf(teamKey), a = (S.teams[teamKey]?.announcements || []).find(x => String(x.id) === id);
    const url = !a ? null : DEMO ? null : await API.flyer(t, a);
    if (!el.isConnected) return;
    if (!url){ el.remove(); return; }
    el.dataset.url = url;
    el.innerHTML = `<img alt="Flyer: ${esc(a ? a.text : "")}" src="${url}">`;
  });
}
function openLightbox(url, alt){
  const box = document.createElement("div");
  box.className = "lightbox"; box.setAttribute("role", "dialog"); box.setAttribute("aria-label", "Flyer");
  box.innerHTML = `<button class="lb-close" aria-label="Close">×</button><img alt="${esc(alt || "")}" src="${url}">`;
  const close = () => { box.remove(); document.removeEventListener("keydown", onKey); };
  const onKey = e => { if (e.key === "Escape") close(); };
  box.addEventListener("click", close); document.addEventListener("keydown", onKey);
  document.body.appendChild(box); box.querySelector(".lb-close").focus();
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act;
  if (act === "tab"){ S.view = b.dataset.view; try { sessionStorage.setItem("rci-serve:view", S.view); } catch(_){} render(); window.scrollTo(0, 0); }
  else if (act === "signin") API.signIn();
  else if (act === "signout"){ try { localStorage.removeItem("rci-serve:cache"); localStorage.removeItem("rci-serve:state"); } catch(_){} API.signOut(); }
  else if (act === "retry") location.reload();
  else if (act === "refresh") loadAll();
  else if (act === "accept") accept(b.dataset.id);
  else if (act === "theme") toggleTheme();
  else if (act === "hide-install"){ S.hideInstall = true; try { sessionStorage.setItem("rci-serve:noinstall", "1"); } catch(_){} render(); }
  else if (act === "install" && deferredInstall){ deferredInstall.prompt(); deferredInstall = null; render(); }
  else if (act === "allow-badge"){ try { await Notification.requestPermission(); } catch(_){} updateBadge(); render(); }
  else if (act === "day"){ S.cal.sel = b.dataset.k; render(); }
  else if (act === "month"){ const [y, m] = S.cal.month.split("-").map(Number), d = new Date(y, m - 1 + Number(b.dataset.d), 1); S.cal.month = keyOf(d).slice(0, 7); render(); }
  else if (act === "filter"){ const k = b.dataset.k; S.cal.off.has(k) ? S.cal.off.delete(k) : S.cal.off.add(k); render(); }
  else if (act === "flyer-open"){ if (b.dataset.url) openLightbox(b.dataset.url, b.querySelector("img")?.alt); }
  else if (act === "church-add"){ S.cal.form = { mode: "add", rowId: null, title: "", date: S.cal.sel || todayKey(), targets: [] }; render(); document.querySelector('[data-field="title"]')?.focus(); }
  else if (act === "church-edit"){ S.cal.form = { mode: "edit", rowId: b.dataset.id, title: b.dataset.title || "", date: b.dataset.date || S.cal.sel, targets: [] }; render(); document.querySelector('[data-field="title"]')?.focus(); }
  else if (act === "church-cancel"){ S.cal.form = null; render(); }
  else if (act === "church-save") churchSave();
  else if (act === "church-target"){ const k = b.dataset.k, f = S.cal.form; if (!f) return; const i = f.targets.indexOf(k); i >= 0 ? f.targets.splice(i, 1) : f.targets.push(k); render(); }
  else if (act === "church-delete"){ if (confirm("Remove this from the church calendar?")) churchRemove(b.dataset.id); }
  else if (act === "church-noservice") churchToggleNoService();
  else if (act === "ann-new"){ S.annForm = { title: "", body: "", until: "", targets: [], flyerBlob: null, flyerName: "", busy: false }; render(); }
  else if (act === "ann-cancel"){ S.annForm = null; render(); }
  else if (act === "ann-target"){ const k = b.dataset.k, f = S.annForm; if (!f) return; const i = f.targets.indexOf(k); i >= 0 ? f.targets.splice(i, 1) : f.targets.push(k); render(); }
  else if (act === "ann-flyer-clear"){ if (S.annForm){ S.annForm.flyerBlob = null; S.annForm.flyerName = ""; render(); } }
  else if (act === "ann-save") annSave();
  else if (act === "notes-new"){ S.notesForm = { rowId: b.dataset.id, date: b.dataset.date, body: "", targets: [], busy: false }; render(); setTimeout(() => $("#notes-editor")?.focus(), 0); }
  else if (act === "notes-cancel"){ S.notesForm = null; render(); }
  else if (act === "notes-target"){ const k = b.dataset.k, f = S.notesForm; if (!f) return; const i = f.targets.indexOf(k); i >= 0 ? f.targets.splice(i, 1) : f.targets.push(k); render(); }
  else if (act === "notes-save") notesSave();
  else if (act === "fmt"){
    const ed = $("#notes-editor"); if (!ed) return;
    ed.focus();
    if (notesRange){ const sel = getSelection(); sel.removeAllRanges(); sel.addRange(notesRange); }
    const cmd = b.dataset.cmd;
    const val = cmd === "foreColor" ? (b.dataset.val === "reset" ? getComputedStyle(ed).color : b.dataset.val) : null;
    try { document.execCommand("styleWithCSS", false, true); document.execCommand(cmd, false, val); } catch(err){}
  }
});
document.addEventListener("change", e => {
  if (e.target.matches('[data-field="ann-flyer"]')){
    const f = S.annForm, file = e.target.files && e.target.files[0]; if (!f || !file) return;
    f.flyerBlob = file; f.flyerName = file.name; render();
  }
});

/* Coming back to the app: refresh after a minute away, and pick up a newer version of RCI Serve. */
document.addEventListener("visibilitychange", async () => {
  if (document.visibilityState !== "visible" || S.phase !== "ready") return;
  try {
    const html = await (await fetch("/index.html", { cache: "no-store" })).text();
    const v = (html.match(/const APP_VERSION = "(\d+)"/) || [])[1];
    if (v && v !== APP_VERSION){ location.reload(); return; }
  } catch(_){}
  if (Date.now() - S.loadedAt > 60000) loadAll();
});

async function start(){
  try { S.view = sessionStorage.getItem("rci-serve:view") || "home"; S.hideInstall = sessionStorage.getItem("rci-serve:noinstall") === "1"; } catch(_){}
  render();
  if (DEMO){ await loadAll(); return; }
  try {
    const signedIn = await API.init();
    if (!signedIn){ S.phase = "signin"; render(); return; }
    S.me = await API.me();
    const c = readCache();
    if (c && c.me.emails.some(x => S.me.emails.includes(x))){ S.teams = c.teams; S.church = { items: c.church || [], error: "" }; S.phase = "ready"; render(); }   // show the saved picture right away
    API.photo().then(p => { S.photo = p; render(); });
    await loadAll();
  } catch(e){
    console.error(e);
    if (S.phase === "ready") return;
    S.phase = "error"; S.error = e.message || String(e); render();
  }
}

if ("serviceWorker" in navigator && location.protocol === "https:" && window.top === window.self){
  navigator.serviceWorker.register("/sw.js", { scope: "/", updateViaCache: "none" }).catch(() => {});
}
start();
</script>
